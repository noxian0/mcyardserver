name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      MCYARD_DATA_DIR: ${{ github.workspace }}/build/app-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install app and build tools
        run: python -m pip install -e ".[build]"
      - name: Build Windows application
        run: python scripts/build_windows.py
      - name: Check packaged startup
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "dist/MCyard Server/MCyard Server.exe" -ArgumentList "--smoke-test" -Wait -PassThru -WindowStyle Hidden
          if ($app.ExitCode -ne 0) { throw "Packaged app failed with exit code $($app.ExitCode)" }
      - name: Build Windows setup
        run: python scripts/build_installer.py
      - name: Save setup and release archives
        uses: actions/upload-artifact@v4
        with:
          name: MCyard Server-Releases
          path: release/
          if-no-files-found: error
          retention-days: 14
      - name: Save portable application artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCyard Server-Windows-x64
          path: dist/MCyard Server/
          if-no-files-found: error
          retention-days: 14
